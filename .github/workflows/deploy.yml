# Every push to main is checked, then its database migrations are applied and
# the app is deployed. Pull requests only run the checks.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, in push order; never cancel one halfway through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: afhlutsdgvsmvitzxhvr
  CLOUDFLARE_ACCOUNT_ID: a0248c53f456d03ba125bde743f3c8ee

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Link Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations
        run: npx supabase db push --dry-run
      # Migrations go first so the new code never runs against an older schema.
      - name: Apply migrations
        run: npx supabase db push --yes
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
